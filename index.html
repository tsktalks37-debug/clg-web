<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Era Hill University - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="login-container">

        <!-- Logo -->
        <div class="logo-section">
            <img src="gehu-logo.png" alt="Graphic Era Hill University">
        </div>

        <!-- Form -->
        <div class="form-section">

            <!-- Username -->
            <div class="input-group">
                <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="userId" placeholder="User ID">
            </div>

            <!-- Password -->
            <div class="input-group password-group">
                <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                <input type="password" id="password" placeholder="Password">
                <span class="toggle-eye" onclick="togglePassword()">
                    <i class="fa-regular fa-eye" id="eyeIcon"></i>
                </span>
            </div>

            <!-- Captcha -->
            <div class="captcha-row">
                <div class="captcha-refresh" onclick="generateCaptcha()" title="Refresh Captcha">
                    <i class="fa-solid fa-rotate-right"></i>
                </div>
                <div class="captcha-image" id="captchaText">WMLM5N</div>
            </div>
            <input type="text" class="captcha-input" id="captchaInput" placeholder="Enter Captcha">

            <!-- Login -->
            <button type="button" class="login-btn" onclick="handleLogin()">LOGIN</button>

            <!-- Links -->
            <div class="links">
                <a href="#">Forgot password ?</a><br>
                <a href="#">Forgot ID ?</a>
            </div>

            <!-- Footer -->
            <div class="footer-credit">Powered by Cyborg IT Services (P) Ltd.</div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
